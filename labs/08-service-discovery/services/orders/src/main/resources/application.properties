# Pedidos · lab 08 (Service Registry y Discovery)
quarkus.application.name=orders

# ── Por DNS: un nombre que Docker resuelve a las IPs de las réplicas ─────
quarkus.rest-client.inventory-dns.url=${INVENTORY_DNS_URL:http://localhost:8103}

# ── Por Consul: client-side discovery con SmallRye Stork ─────────────────
quarkus.rest-client.inventory-consul.url=stork://inventory
quarkus.stork.inventory.service-discovery.type=consul
quarkus.stork.inventory.service-discovery.consul-host=${CONSUL_HOST:localhost}
quarkus.stork.inventory.service-discovery.consul-port=${CONSUL_PORT:8500}
# Cada cuánto vuelve a preguntarle a Consul. El default es 5 minutos: demasiado para ver el lab.
quarkus.stork.inventory.service-discovery.refresh-period=2S
# Solo instancias con el health check en verde (es el default; explícito para que se vea).
quarkus.stork.inventory.service-discovery.use-health-checks=true
quarkus.stork.inventory.load-balancer.type=round-robin

quarkus.rest-client.connect-timeout=1000
quarkus.rest-client.read-timeout=2000

quarkus.swagger-ui.always-include=true
