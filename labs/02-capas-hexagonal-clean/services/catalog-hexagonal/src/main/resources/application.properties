# Catálogo · lab 02 · versión HEXAGONAL (puertos y adaptadores)
quarkus.application.name=catalog-hexagonal

# Qué adaptador de persistencia se enchufa: postgres | memory. El dominio no se entera.
catalog.persistence=${CATALOG_PERSISTENCE:postgres}

# BD: QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD llegan por variables de entorno.
# Las tres versiones del lab comparten la base "catalog", cada una en su propio esquema.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=hexagonal
quarkus.hibernate-orm.database.default-schema=hexagonal
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.swagger-ui.always-include=true
