# Pedidos · lab 07 (API Gateway)
quarkus.application.name=orders

# ── OIDC: valida el JWT que emite Keycloak (defensa en profundidad) ─────
# Dos URLs distintas para el MISMO Keycloak, y es a propósito:
#  - OIDC_SERVER_URL: cómo lo alcanza ESTE contenedor (red interna: keycloak:8080),
#    para descargar las claves públicas (JWKS) con las que verifica la firma.
#  - OIDC_ISSUER: el "iss" que viene DENTRO del token. Keycloak lo emite con la URL
#    pública (localhost:8180), porque así lo pidió el cliente. Si no coincide → 401.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_SERVER_URL:http://localhost:8180/realms/mercado}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs
quarkus.oidc.token.issuer=${OIDC_ISSUER:http://localhost:8180/realms/mercado}
# El nombre del usuario sale de "preferred_username" y los roles, de "realm_access.roles".
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.roles.role-claim-path=realm_access/roles

# En los tests la identidad se simula con @TestSecurity: sin Keycloak.
quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false

quarkus.swagger-ui.always-include=true
