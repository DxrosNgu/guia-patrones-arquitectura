# Ambiente LOCAL (Compose lo carga solo).
# Los servicios también se publican para poder llamarlos SIN pasar por el gateway
# (experimento de defensa en profundidad). En prod solo se expondría el gateway.
services:
  gateway:
    ports: ["8080:8080"]
  # keycloak publica el 8180 desde infra/keycloak.yaml
  catalog:
    ports: ["8101:8080"]
  orders:
    ports: ["8102:8080"]
