# El navegador solo habla con nginx; nginx reenvía cada /api/<servicio> a su contenedor.
#
# ⚠️ Por defecto nginx resuelve "inventory" UNA vez al arrancar y guarda esa IP para
# siempre. Si el contenedor se reinicia y cambia de IP, nginx sigue mandando
# tráfico a la vieja (502). Con `resolver` (el DNS interno de Docker) y el destino
# en una variable, nginx vuelve a resolver el nombre cada 10 s.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    set $orders    http://orders:8080;
    set $inventory http://inventory:8000;
    set $payments  http://payments:8080;
    set $shipping  http://shipping:8000;

    location /api/orders {
        proxy_pass $orders;
    }
    location /api/inventory/ {
        rewrite ^/api/inventory/(.*)$ /api/$1 break;
        proxy_pass $inventory;
    }
    location /api/payments/ {
        rewrite ^/api/payments/(.*)$ /api/$1 break;
        proxy_pass $payments;
    }
    location /api/shipping/ {
        rewrite ^/api/shipping/(.*)$ /api/$1 break;
        proxy_pass $shipping;
    }

    location / {
        try_files $uri /index.html;
    }
}
