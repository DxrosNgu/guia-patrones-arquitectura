# Pagos · lab 17 (saga por orquestación)
quarkus.application.name=payments
payments.approval-limit=${PAYMENTS_APPROVAL_LIMIT:500.00}

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── Kafka ────────────────────────────────────────────────────────────────
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Orquestación: pagos solo escucha SUS comandos.
mp.messaging.incoming.saga-in.connector=smallrye-kafka
mp.messaging.incoming.saga-in.topics=payments.commands
mp.messaging.incoming.saga-in.group.id=payments
mp.messaging.incoming.saga-in.auto.offset.reset=earliest
mp.messaging.incoming.saga-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Un mensaje que falla siempre (veneno) va a payments.dlq en vez de detener el consumidor.
mp.messaging.incoming.saga-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.saga-in.dead-letter-queue.topic=payments.dlq

# Salida: el topic de cada mensaje lo decide la outbox (OutgoingKafkaRecordMetadata).
mp.messaging.outgoing.saga-out.connector=smallrye-kafka
mp.messaging.outgoing.saga-out.topic=saga.replies
mp.messaging.outgoing.saga-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.saga-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

outbox.poll-interval=500ms
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.scheduler.enabled=false

quarkus.swagger-ui.always-include=true
