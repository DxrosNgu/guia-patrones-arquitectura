# ─────────────────────────────────────────────────────────────────────────
# Lab 20 · Strangler Fig
#
#   docker compose up --build -d
#   curl -X PUT localhost:8080/admin/migration/stage/3      → etapas 1 a 5, en caliente
#   curl -X PUT localhost:8080/admin/migration -H 'Content-Type: application/json' -d '{"ordersToNewPercent":0}'   → rollback
#
#   cliente ─▶ gateway (Spring Cloud Gateway) ─┬─▶ legacy-shop (FastAPI, el monolito)
#                                               ├─▶ catalog (Quarkus, nuevo)
#                                               └─▶ orders  (Quarkus, nuevo) ◀── sincroniza ──▶ legacy-shop
# ─────────────────────────────────────────────────────────────────────────
name: lab20-strangler-fig

include:
  - ../../infra/postgres.yaml

services:
  legacy-shop:
    build: ./services/legacy-shop
    image: mercado/lab20-legacy-shop:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://legacy_shop:legacy_shop@postgres:5432/legacy_shop
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build: ./services/catalog
    image: mercado/lab20-catalog:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/catalog
      QUARKUS_DATASOURCE_USERNAME: catalog
      QUARKUS_DATASOURCE_PASSWORD: catalog
      LEGACY_URL: http://legacy-shop:8000      # solo para la copia inicial del catálogo
    depends_on:
      postgres:
        condition: service_healthy
      legacy-shop:
        condition: service_healthy

  orders:
    build: ./services/orders
    image: mercado/lab20-orders:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orders
      QUARKUS_DATASOURCE_USERNAME: orders
      QUARKUS_DATASOURCE_PASSWORD: orders
      CATALOG_URL: http://catalog:8080
      LEGACY_URL: http://legacy-shop:8000      # sincronización en los dos sentidos
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy

  gateway:
    build: ./gateway
    image: mercado/lab20-gateway:1.0.0
    environment:
      LEGACY_URL: http://legacy-shop:8000
      CATALOG_URL: http://catalog:8080
      ORDERS_URL: http://orders:8080
    depends_on:
      legacy-shop:
        condition: service_healthy
