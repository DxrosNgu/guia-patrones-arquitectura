# Pedidos NUEVO · lab 20 (Strangler Fig)
quarkus.application.name=orders

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%test.quarkus.datasource.devservices.image-name=postgres:17.12-alpine

# El precio sale del catálogo NUEVO (ya migrado en la etapa 2).
quarkus.rest-client.catalog.url=${CATALOG_URL:http://localhost:8101}
# El legado: para copiar sus pedidos y mandarle los nuevos mientras dure la migración.
quarkus.rest-client.legacy.url=${LEGACY_URL:http://localhost:8120}
quarkus.rest-client.legacy.connect-timeout=1000
quarkus.rest-client.legacy.read-timeout=2000

# Sincronización con el legado (se apaga en caliente en la etapa 5: PUT /admin/sync).
orders.sync.enabled=${SYNC_ENABLED:true}
orders.sync.every=${SYNC_EVERY:1s}

quarkus.swagger-ui.always-include=true
