# ─────────────────────────────────────────────────────────────────────────
# Lab 03 · Domain-Driven Design
#
# Un servicio de pedidos con DOS modelos lado a lado:
#   /api/anemic/orders   ❌ modelo anémico (getters/setters, reglas repartidas)
#   /api/orders          ✅ agregado Order con value objects y eventos de dominio
#
#   docker compose up --build -d
# ─────────────────────────────────────────────────────────────────────────
name: lab03-ddd

include:
  - ../../infra/postgres.yaml

services:
  orders:
    build: ./services/orders
    image: mercado/lab03-orders:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orders
      QUARKUS_DATASOURCE_USERNAME: orders
      QUARKUS_DATASOURCE_PASSWORD: orders
    depends_on:
      postgres:
        condition: service_healthy
