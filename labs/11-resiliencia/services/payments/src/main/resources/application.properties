# Pagos · lab 11 (resiliencia)
quarkus.application.name=payments

# La pasarela externa. read-timeout de 30 s: es lo que espera la versión INGENUA.
# La versión resiliente corta antes, con @Timeout(500).
quarkus.rest-client.provider.url=${PROVIDER_URL:http://localhost:8122}
quarkus.rest-client.provider.read-timeout=30000

# Cada cuánto el reconciliador reintenta los pagos pendientes.
payments.reconcile-every=${RECONCILE_EVERY:5s}
# En los tests no corre solo: el test de reconciliación lo invoca a mano (si no, se cruza con los demás tests).
%test.quarkus.scheduler.enabled=false

# Las anotaciones de tolerancia a fallas se pueden cambiar por configuración, sin recompilar.
# Ejemplo: cuánto tiempo queda abierto el circuito antes de probar otra vez (semiabierto).
com.mercadoinventos.payments.ResilientProvider/charge/CircuitBreaker/delay=${CIRCUIT_OPEN_MS:5000}

# ── Métricas → Grafana LGTM (solo métricas; las trazas son del lab 10) ───
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.traces.enabled=false
%test.quarkus.otel.sdk.disabled=true

quarkus.swagger-ui.always-include=true
