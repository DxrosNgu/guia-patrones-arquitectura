# El navegador solo habla con nginx.
#  - /bff/...            → el BFF (la forma recomendada)
#  - /api/<servicio>...  → los servicios directo (solo para el modo "Sin BFF" del lab)
#
# `resolver` + destino en variable: nginx vuelve a resolver los nombres cada 10 s,
# así un contenedor reiniciado (con otra IP) no deja a nginx apuntando a la vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    set $bff      http://bff:8000;
    set $orders   http://orders:8080;
    set $payments http://payments:8080;
    set $shipping http://shipping:8000;

    location /bff/           { proxy_pass $bff; }
    location /api/orders     { proxy_pass $orders; }
    location /api/payments   { proxy_pass $payments; }
    location /api/shipments  { proxy_pass $shipping; }

    location / {
        try_files $uri /index.html;
    }
}
