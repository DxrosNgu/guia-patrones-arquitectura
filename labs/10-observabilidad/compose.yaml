# ─────────────────────────────────────────────────────────────────────────
# Lab 10 · Observabilidad distribuida
#
#   docker compose up --build -d
#   Grafana: http://localhost:3001  (Explore → Tempo / Loki / Prometheus)
#
#   cliente ─▶ gateway :8080 ─▶ orders ─▶ Kafka ─▶ inventory      (una sola traza, de punta a punta)
# ─────────────────────────────────────────────────────────────────────────
name: lab10-observabilidad

include:
  - ../../infra/postgres.yaml
  - ../../infra/kafka.yaml
  - ../../infra/observability.yaml   # lgtm: Grafana + Tempo + Loki + Prometheus + colector OTel

services:
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.events.dlq --partitions 1 --replication-factor 1

  orders:
    build: ./services/orders
    image: mercado/lab10-orders:1.0.0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_URL: http://inventory:8000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orders
      QUARKUS_DATASOURCE_USERNAME: orders
      QUARKUS_DATASOURCE_PASSWORD: orders
      # Quarkus exporta por OTLP/gRPC (puerto 4317).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  inventory:
    build: ./services/inventory
    image: mercado/lab10-inventory:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Python exporta por OTLP/HTTP (puerto 4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_SERVICE_NAME: inventory
      STOCK_LOOKUP_DELAY_MS: ${STOCK_LOOKUP_DELAY_MS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # La puerta de entrada: aquí EMPIEZA la traza. Spring Cloud Gateway sin código de observabilidad:
  # el agente de OpenTelemetry para Java (-javaagent, ver gateway/Dockerfile) lo instrumenta todo.
  gateway:
    build: ./gateway
    image: mercado/lab10-gateway:1.0.0
    environment:
      ORDERS_URL: http://orders:8080
      INVENTORY_URL: http://inventory:8000
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318   # el agente usa OTLP/HTTP por defecto
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      # Experimento: OTEL_JAVAAGENT_ENABLED=false apaga el agente y el gateway desaparece de la traza.
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-true}
    depends_on:
      orders:
        condition: service_healthy
