# Pedidos · lab 10 (observabilidad)
quarkus.application.name=orders

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── Kafka ────────────────────────────────────────────────────────────────
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.orders-events.connector=smallrye-kafka
mp.messaging.outgoing.orders-events.topic=orders.events
mp.messaging.outgoing.orders-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.quarkus.kafka.devservices.enabled=false

# ── Inventario: consulta de stock antes de aceptar el pedido ─────────────
quarkus.rest-client.inventory.url=${INVENTORY_URL:http://localhost:8103}
quarkus.rest-client.connect-timeout=2000
quarkus.rest-client.read-timeout=5000

# ── OpenTelemetry: trazas, métricas y logs → OTLP (Grafana LGTM) ─────────
# El nombre del servicio en las trazas sale de quarkus.application.name.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
# Un span por cada consulta SQL.
quarkus.datasource.jdbc.telemetry=true
# El traceId en CADA línea de log: el hilo que une logs y trazas.
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} [%c{2.}] %s%e%n

# ── Health checks ───────────────────────────────────────────────────────
# /q/health/live  → ¿el proceso está vivo? (si no, reiniciarlo)
# /q/health/ready → ¿puede atender tráfico? (incluye la BD y Kafka)
quarkus.kafka.health.enabled=true
# En los tests el canal es en memoria: no hay broker que chequear.
%test.quarkus.kafka.health.enabled=false

quarkus.swagger-ui.always-include=true
