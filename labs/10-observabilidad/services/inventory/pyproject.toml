[project]
name = "inventory"
version = "1.0.0"
description = "Mercado de Inventos · 10-observabilidad · servicio inventory"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.0.57",
    "psycopg[binary]==3.3.9",
    "aiokafka==0.15.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.1",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
# Es una aplicación, no una librería: uv no la instala como paquete.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
