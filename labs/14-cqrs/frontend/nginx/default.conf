# El navegador solo habla con nginx:
#   /api/orders   → lado de COMANDOS (orders)
#   /api/history  → lado de CONSULTAS (order-history)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    set $orders  http://orders:8080;
    set $history http://history-api:8000;

    location /api/orders  { proxy_pass $orders; }
    location /api/history { proxy_pass $history; proxy_read_timeout 15s; }

    location / {
        try_files $uri /index.html;
    }
}
