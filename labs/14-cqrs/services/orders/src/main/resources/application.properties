# Pedidos · lab 14 (CQRS): el lado de COMANDOS
quarkus.application.name=orders

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.orders-events.connector=smallrye-kafka
mp.messaging.outgoing.orders-events.topic=orders.events
mp.messaging.outgoing.orders-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# El default de SmallRye es acks=1 (ver lab 06).
mp.messaging.outgoing.orders-events.acks=all
%test.quarkus.kafka.devservices.enabled=false

quarkus.swagger-ui.always-include=true
