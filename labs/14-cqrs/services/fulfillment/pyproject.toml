[project]
name = "fulfillment"
version = "1.0.0"
description = "Mercado de Inventos · 14-cqrs · simulador de pagos y envíos"
requires-python = ">=3.13"
dependencies = [
    "aiokafka==0.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# Es una aplicación, no una librería: uv no la instala como paquete.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
