# ─────────────────────────────────────────────────────────────────────────
# Lab 18 · Event Sourcing: el monedero
#
#   docker compose up --build -d
#   THINK_TIME_MS=300 docker compose up -d wallet   → arranca con la "ventana" de concurrencia abierta
#   SNAPSHOT_EVERY=3 docker compose up -d wallet    → un snapshot cada 3 eventos
#
# Un solo servicio y su base. La tabla `events` es la fuente de verdad; todo lo demás se deriva.
# ─────────────────────────────────────────────────────────────────────────
name: lab18-event-sourcing

include:
  - ../../infra/postgres.yaml

services:
  wallet:
    build: ./services/wallet
    image: mercado/lab18-wallet:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/wallet
      QUARKUS_DATASOURCE_USERNAME: wallet
      QUARKUS_DATASOURCE_PASSWORD: wallet
      SNAPSHOT_EVERY: ${SNAPSHOT_EVERY:-5}
      THINK_TIME_MS: ${THINK_TIME_MS:-0}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
