# Monedero · lab 18 (Event Sourcing)
quarkus.application.name=wallet

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
# Para el experimento de concurrencia: varias peticiones a la vez necesitan varias conexiones.
quarkus.datasource.jdbc.max-size=30
%test.quarkus.datasource.devservices.image-name=postgres:17.12-alpine

# Un snapshot cada N eventos.
wallet.snapshot-every=${SNAPSHOT_EVERY:5}
# Intentos ante un conflicto de versión (concurrencia optimista). Se cambia en caliente: PUT /admin/retries
wallet.max-attempts=${MAX_ATTEMPTS:3}
# Tiempo artificial entre LEER y GUARDAR, para que dos comandos concurrentes se crucen. PUT /admin/think-time
wallet.think-time-ms=${THINK_TIME_MS:0}
# Cada cuánto el proyector busca eventos nuevos.
# El scheduler de Quarkus no acepta menos de 1 s.
wallet.projector.every=${PROJECTOR_EVERY:1s}
# Los meses de la proyección y las fechas de ?at= se interpretan en esta zona.
wallet.zone=America/Lima

quarkus.swagger-ui.always-include=true
