# Pedidos · lab 05. Dueño exclusivo de su base `orders`.
quarkus.application.name=orders

# BD: QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD llegan por variables de entorno.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=flyway_history_orders
# En la BD compartida (versión ingenua) Flyway encuentra tablas de OTROS servicios
# y se niega a migrar. baseline-version=0 hace que igual aplique nuestra V1.
# Que haga falta esto ya es un síntoma del acoplamiento.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Otros servicios: direcciones por variable de entorno (distintas en cada ambiente).
quarkus.rest-client.inventory.url=${INVENTORY_URL:http://localhost:8103}
quarkus.rest-client.payments.url=${PAYMENTS_URL:http://localhost:8104}
# Nunca esperar para siempre a otro servicio (más sobre esto en el lab 11).
quarkus.rest-client.connect-timeout=2000
quarkus.rest-client.read-timeout=5000

quarkus.swagger-ui.always-include=true
