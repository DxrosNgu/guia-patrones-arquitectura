# ─────────────────────────────────────────────────────────────────────────
# Lab 05 · Microservicios y Database per Service
#
#   docker compose up --build -d                    → arquitectura correcta
#   docker compose --profile naive up --build -d    → + la versión ingenua al lado
#
# Las DOS versiones usan las mismas imágenes. Lo único que cambia es a qué
# base se conecta cada servicio.
# ─────────────────────────────────────────────────────────────────────────
name: lab05-microservicios

include:
  - ../../infra/postgres.yaml   # crea una base y un usuario por servicio (orders, inventory, payments, shop...)

x-quarkus-db: &quarkus-db
  postgres:
    condition: service_healthy

services:
  # ═══ Database per Service: cada servicio con SU base y SU usuario ═══════
  orders:
    build: ./services/orders
    image: mercado/lab05-orders:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orders
      QUARKUS_DATASOURCE_USERNAME: orders
      QUARKUS_DATASOURCE_PASSWORD: orders
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8080
    depends_on:
      <<: *quarkus-db
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy

  inventory:
    build: ./services/inventory
    image: mercado/lab05-inventory:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory
      INVENTORY_V2: ${INVENTORY_V2:-false}
    depends_on: *quarkus-db

  payments:
    build: ./services/payments
    image: mercado/lab05-payments:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/payments
      QUARKUS_DATASOURCE_USERNAME: payments
      QUARKUS_DATASOURCE_PASSWORD: payments
    depends_on: *quarkus-db

  report:
    build: ./services/report
    image: mercado/lab05-report:1.0.0
    environment:
      REPORT_SOURCE: api            # ✅ solo APIs públicas
      ORDERS_URL: http://orders:8080
      INVENTORY_URL: http://inventory:8000
    depends_on:
      orders:
        condition: service_healthy

  # ═══ Versión ingenua (perfil "naive"): TODOS contra la base compartida "shop" ═══
  orders-naive:
    profiles: [naive]
    build: ./services/orders
    image: mercado/lab05-orders:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      QUARKUS_DATASOURCE_USERNAME: shop
      QUARKUS_DATASOURCE_PASSWORD: shop
      INVENTORY_URL: http://inventory-naive:8000
      PAYMENTS_URL: http://payments-naive:8080
    depends_on:
      <<: *quarkus-db
      inventory-naive:
        condition: service_healthy
      payments-naive:
        condition: service_healthy

  inventory-naive:
    profiles: [naive]
    build: ./services/inventory
    image: mercado/lab05-inventory:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@postgres:5432/shop
      INVENTORY_V2: ${INVENTORY_V2:-false}
    depends_on: *quarkus-db

  payments-naive:
    profiles: [naive]
    build: ./services/payments
    image: mercado/lab05-payments:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      QUARKUS_DATASOURCE_USERNAME: shop
      QUARKUS_DATASOURCE_PASSWORD: shop
    depends_on: *quarkus-db

  report-naive:
    profiles: [naive]
    build: ./services/report
    image: mercado/lab05-report:1.0.0
    environment:
      REPORT_SOURCE: database       # ❌ JOIN directo sobre tablas de otros equipos
      DATABASE_URL: postgresql+psycopg://shop:shop@postgres:5432/shop
    depends_on:
      orders-naive:
        condition: service_healthy
