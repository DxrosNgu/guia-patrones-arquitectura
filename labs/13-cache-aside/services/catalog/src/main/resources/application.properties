# Catálogo · lab 13 (Cache-Aside)
quarkus.application.name=catalog
catalog.instance=${INSTANCE_NAME:catalog}

# Cuánto tarda la consulta "cara" (simulada con pg_sleep).
catalog.db-delay-ms=${DB_DELAY_MS:200}
# Cuánto vive una entrada en la caché si nadie la invalida antes.
catalog.cache-ttl=${CACHE_TTL:30S}
# Candado contra el cache stampede (se puede cambiar en caliente: PUT /admin/stampede-protection).
catalog.stampede-protection=${STAMPEDE_PROTECTION:true}

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
# Para que el stampede se vea: 20 lecturas a la vez necesitan 20 conexiones.
quarkus.datasource.jdbc.max-size=30

# Redis: en los tests lo levanta Dev Services; en el contenedor llega por REDIS_URL.
%prod.quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

quarkus.swagger-ui.always-include=true
