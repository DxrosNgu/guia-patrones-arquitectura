# Mercado de Inventos · lab 04 · monolito modular (UN deployable)
quarkus.application.name=shop

# Una base, un esquema por módulo. Flyway junta las migraciones de todos los módulos
# (cada uno trae las suyas en db/migration/<módulo>) y crea los esquemas.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=public,catalog,inventory,payments,orders,shipping
quarkus.flyway.locations=db/migration/catalog,db/migration/inventory,db/migration/payments,db/migration/orders,db/migration/shipping
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

payments.approval-limit=${PAYMENTS_APPROVAL_LIMIT:500.00}
shipping.chaos-fail=${SHIPPING_CHAOS_FAIL:false}

quarkus.swagger-ui.always-include=true
