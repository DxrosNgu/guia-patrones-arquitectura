# ─────────────────────────────────────────────────────────────────────────
# Lab 04 · Monolito modular
#
# Mercado de Inventos completo en UN contenedor (shop), con un módulo por
# bounded context y un esquema de Postgres por módulo.
#
#   docker compose up --build -d
#   SHIPPING_CHAOS_FAIL=true docker compose up -d   → envíos falla después del commit
# ─────────────────────────────────────────────────────────────────────────
name: lab04-monolito-modular

include:
  - ../../infra/postgres.yaml

services:
  shop:
    build: ./shop
    image: mercado/lab04-shop:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      QUARKUS_DATASOURCE_USERNAME: shop
      QUARKUS_DATASOURCE_PASSWORD: shop
      PAYMENTS_APPROVAL_LIMIT: ${PAYMENTS_APPROVAL_LIMIT:-500.00}
      SHIPPING_CHAOS_FAIL: ${SHIPPING_CHAOS_FAIL:-false}
    depends_on:
      postgres:
        condition: service_healthy
