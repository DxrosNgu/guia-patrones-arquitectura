# ───────────────────────────────────────────────────────────────────────
# Catálogo · configuración
#
# Regla del lab: el CÓDIGO no sabe en qué ambiente corre. Todo lo que cambia
# entre local, dev y prod llega desde fuera (variables de entorno o secretos).
#
# Quarkus mapea cada propiedad a una variable de entorno:
#   app.environment            → APP_ENVIRONMENT
#   quarkus.datasource.password → QUARKUS_DATASOURCE_PASSWORD
# ───────────────────────────────────────────────────────────────────────

# Sin valor por defecto a propósito: si falta, la app NO arranca (fail fast).
app.environment=${APP_ENV}
app.featured-enabled=${FEATURED_ENABLED:false}

quarkus.application.name=catalog

# Base de datos: URL, usuario y contraseña llegan por variables de entorno
# (QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD).
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Logs: nivel y formato configurables (texto legible en local, JSON en dev/prod).
# El nivel aplica a NUESTRO código; las librerías (Hibernate, Vert.x...) quedan en INFO.
quarkus.log.category."com.mercadoinventos".level=${LOG_LEVEL:INFO}
quarkus.log.console.json.enabled=${LOG_JSON:false}

# Swagger UI: incluido en la imagen, se activa o desactiva por ambiente.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ── Perfiles de Quarkus (modo de ejecución, NO ambiente) ────────────────
# %dev  → ./mvnw quarkus:dev en tu máquina (Dev Services levanta Postgres solo)
# %test → ./mvnw verify
%dev.app.environment=local-host
%test.app.environment=test
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
