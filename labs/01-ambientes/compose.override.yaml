# ─────────────────────────────────────────────────────────────────────────
# Ambiente LOCAL. Compose carga este archivo automáticamente con
# `docker compose up`, así que no hace falta nombrarlo.
#
# - Todos los puertos expuestos: puedes entrar a la BD o a cada servicio.
# - Secretos falsos con valores por defecto: el lab arranca sin crear nada.
# ─────────────────────────────────────────────────────────────────────────
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalog}
    ports:
      - "5432:5432"

  catalog:
    environment:
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-catalog}
    ports:
      - "8101:8080"

  inventory:
    environment:
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:-sk-local-fake-0000}
    ports:
      - "8103:8000"

  frontend:
    ports:
      - "3000:80"
