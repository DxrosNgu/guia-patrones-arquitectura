# ─────────────────────────────────────────────────────────────────────────
# Lab 01 · Ambientes y configuración externalizada
#
# BASE: lo que es igual en TODOS los ambientes. Ningún secreto vive aquí.
# Cada ambiente agrega lo suyo con un overlay:
#   local → compose.override.yaml   (Compose lo carga solo)
#   dev   → compose.dev.yaml
#   prod  → compose.prod.yaml
# ─────────────────────────────────────────────────────────────────────────
name: lab01-ambientes

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      # La contraseña la define cada ambiente (variable, o archivo secreto en prod).
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP (-h 127.0.0.1): el socket Unix ya responde durante el init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog:
    build:
      context: ./services/catalog
      # Archivos compartidos entre labs (shared/): el Dockerfile los usa con COPY --from=shared
      additional_contexts:
        shared: ../../shared
    # El tag es la VERSIÓN, no el ambiente: la misma imagen viaja de local a prod.
    image: mercado/lab01-catalog:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-local}
      FEATURED_ENABLED: ${FEATURED_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_JSON: ${LOG_JSON:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/catalog
      QUARKUS_DATASOURCE_USERNAME: catalog
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build:
      context: ./services/inventory
      additional_contexts:
        shared: ../../shared
    image: mercado/lab01-inventory:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_JSON: ${LOG_JSON:-false}

  frontend:
    build: ./frontend
    image: mercado/lab01-frontend:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-local}
      # Direcciones INTERNAS (red de Compose): nombre del servicio + puerto del contenedor.
      CATALOG_URL: http://catalog:8080
      INVENTORY_URL: http://inventory:8000
    depends_on:
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy

volumes:
  db-data:
