server {
    listen 80;
    root /usr/share/nginx/html;

    # remoteEntry.js es el PUNTERO a la versión desplegada: nunca se cachea. Así, al desplegar una versión
    # nueva del remoto, el shell la usa en la siguiente carga de página, sin reconstruirse.
    location = /remoteEntry.js {
        add_header Cache-Control "no-cache";
    }

    # Todo lo demás lleva un hash en el nombre: se cachea para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La página del modo independiente.
    location / {
        try_files $uri /index.html;
    }
}
