# El shell sirve su página y hace de puerta a los remotos: /remotes/<equipo>/ → el contenedor de ese equipo.
# Mismo origen para todo: sin CORS. En prod, este papel lo cumple un CDN o un ingress con rutas por prefijo.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Variables + resolver: nginx arranca aunque un remoto esté caído, y lo vuelve a buscar en cada petición.
    set $catalog http://catalog-mfe;
    set $orders  http://orders-mfe;

    location /remotes/catalog/ {
        rewrite ^/remotes/catalog/(.*)$ /$1 break;
        proxy_pass $catalog;
    }
    location /remotes/orders/ {
        rewrite ^/remotes/orders/(.*)$ /$1 break;
        proxy_pass $orders;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas del shell (/catalogo, /pedidos/P-42...): siempre la misma página.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
