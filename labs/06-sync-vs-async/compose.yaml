# ─────────────────────────────────────────────────────────────────────────
# Lab 06 · Comunicación síncrona vs. asíncrona
#
#   docker compose up --build -d                          → modo async (por defecto)
#   ORDERS_MODE=sync docker compose up -d orders          → cambia pedidos a modo sync
#   EVENT_STYLE=notification docker compose up -d orders  → eventos "notification"
#   docker compose --profile scale up -d --scale inventory-worker=2  → competing consumers
# ─────────────────────────────────────────────────────────────────────────
name: lab06-sync-vs-async

include:
  - ../../infra/postgres.yaml
  - ../../infra/kafka.yaml        # kafka (kafka:9092) + kafka-ui (http://localhost:8090)

services:
  # Crea los topics una vez y termina. 3 particiones → hasta 3 consumidores en paralelo.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.events.dlq --partitions 1 --replication-factor 1

  orders:
    build: ./services/orders
    image: mercado/lab06-orders:1.0.0
    environment:
      ORDERS_MODE: ${ORDERS_MODE:-async}
      EVENT_STYLE: ${EVENT_STYLE:-state}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_URL: http://inventory:8000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orders
      QUARKUS_DATASOURCE_USERNAME: orders
      QUARKUS_DATASOURCE_PASSWORD: orders
    # Ojo: pedidos NO depende de inventario para arrancar. En modo async ni siquiera lo necesita.
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  inventory:
    build: ./services/inventory
    image: mercado/lab06-inventory:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDERS_URL: http://orders:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Réplicas extra de inventario, SIN puertos publicados: solo consumen eventos.
  # Comparten el group id "inventory" con el servicio de arriba, así que Kafka
  # les reparte las 3 particiones (Competing Consumers).
  inventory-worker:
    profiles: [scale]
    build: ./services/inventory
    image: mercado/lab06-inventory:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDERS_URL: http://orders:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
