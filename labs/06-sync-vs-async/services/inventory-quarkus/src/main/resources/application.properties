# Inventario · versión Quarkus del consumidor (lab 06, perfil "quarkus")
quarkus.application.name=inventory-quarkus

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory_quarkus
quarkus.hibernate-orm.database.default-schema=inventory_quarkus
# Las consultas SQL nativas también deben ir a este esquema (search_path de la conexión).
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=inventory_quarkus
quarkus.hibernate-orm.schema-management.strategy=none

# ── Kafka: compara cada línea con app/consumer.py ───────────────────────
# En los tests, Dev Services levanta un Kafka real en Docker (no se define bootstrap).
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.orders-events.connector=smallrye-kafka
mp.messaging.incoming.orders-events.topic=orders.events
# Otro group id: recibe TODOS los eventos, además del inventario Python (Publish/Subscribe).
mp.messaging.incoming.orders-events.group.id=inventory-quarkus
mp.messaging.incoming.orders-events.auto.offset.reset=earliest
# El offset se confirma DESPUÉS de procesar (ack). Nunca auto-commit por tiempo.
mp.messaging.incoming.orders-events.enable.auto.commit=false
mp.messaging.incoming.orders-events.commit-strategy=throttled
# Mensaje que falla (nack) → se publica en este topic con el motivo en headers, y se sigue.
mp.messaging.incoming.orders-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.orders-events.dead-letter-queue.topic=orders.events.dlq-quarkus

# ── Pedidos (solo para eventos "notification") ──────────────────────────
quarkus.rest-client.orders.url=${ORDERS_URL:http://localhost:8102}
quarkus.rest-client.connect-timeout=2000
quarkus.rest-client.read-timeout=3000

quarkus.swagger-ui.always-include=true
