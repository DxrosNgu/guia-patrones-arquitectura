# Pedidos · lab 06
quarkus.application.name=orders

# sync  → llama a inventario por HTTP y ESPERA su respuesta
# async → guarda el pedido, publica OrderPlaced en Kafka y responde de inmediato
orders.mode=${ORDERS_MODE:async}
# state        → el evento lleva los ítems (Event-Carried State Transfer)
# notification → el evento solo avisa; inventario debe pedirle los ítems a pedidos
orders.event-style=${EVENT_STYLE:state}

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── Kafka ────────────────────────────────────────────────────────────────
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.orders-events.connector=smallrye-kafka
mp.messaging.outgoing.orders-events.topic=orders.events
mp.messaging.outgoing.orders-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# ⚠️ El conector de SmallRye usa acks=1 por defecto (el cliente de Kafka usa all): Kafka confirmaría
# con UNA sola copia y min.insync.replicas no se aplicaría. Se fija en all; ORDERS_ACKS=1 sirve
# para el experimento de prod (README).
mp.messaging.outgoing.orders-events.acks=${ORDERS_ACKS:all}
# En los tests el canal se reemplaza por uno en memoria: no hace falta un Kafka.
%test.quarkus.kafka.devservices.enabled=false

# ── Inventario (solo modo sync) ──────────────────────────────────────────
quarkus.rest-client.inventory.url=${INVENTORY_URL:http://localhost:8103}
quarkus.rest-client.connect-timeout=2000
quarkus.rest-client.read-timeout=5000

quarkus.swagger-ui.always-include=true
