# ─────────────────────────────────────────────────────────────────────────
# Ambiente PROD del lab 06 (OPCIONAL): Kafka como en producción, con 3 nodos.
#
#   docker compose up --build -d && docker compose down        # construir las imágenes una vez
#   docker compose -f compose.yaml -f compose.prod.yaml up -d  # el clúster de 3 nodos
#   ./smoke-prod.sh
#
# ⚠️ Pide unos 1,5 GB de RAM MÁS que el lab en local (ver "Requisitos" en el README).
#
# Qué cambia frente a local:
# - 3 nodos KRaft (cada uno es broker y controller). El quórum de controllers
#   tolera la caída de 1 nodo; los datos, también (replicación 3, min ISR 2).
# - Los topics se crean con replication-factor 3 y min.insync.replicas=2:
#   una escritura con acks=all necesita 2 copias. Pedidos publica con acks=all
#   (ojo: el default de SmallRye es acks=1).
# - Sin auto-creación de topics: en prod se crean a propósito.
# - Kafka y Postgres no se exponen. Pedidos e inventario usan 8202 y 8203
#   para no chocar con local (como el lab 01).
# ─────────────────────────────────────────────────────────────────────────
name: lab06-sync-vs-async-prod

x-kafka-cluster: &kafka-cluster
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # Los 3 votantes del quórum KRaft. Con 3, la mayoría es 2: se tolera perder 1.
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
  # El mismo ID en los 3 nodos: es lo que los hace UN clúster.
  CLUSTER_ID: ZaJZtZo9QTmhvZmUyVxalg
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_HEAP_OPTS: -Xmx384m -Xms384m

x-kafka-node: &kafka-node
  image: apache/kafka:4.3.2
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 20s

x-bootstrap: &bootstrap kafka:9092,kafka-2:9092,kafka-3:9092

services:
  postgres:
    ports: !reset []

  # El kafka de infra/kafka.yaml pasa a ser el nodo 1 del clúster.
  kafka:
    ports: !reset []
    environment:
      <<: *kafka-cluster
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092

  kafka-2:
    <<: *kafka-node
    environment:
      <<: *kafka-cluster
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092

  kafka-3:
    <<: *kafka-node
    environment:
      <<: *kafka-cluster
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092

  kafka-ui:
    ports: !override ["8290:8080"]   # solo para mirar el clúster durante el lab
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: *bootstrap

  kafka-init:
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - |
        for topic in orders.events:3 orders.events.dlq:1 orders.events.dlq-quarkus:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${topic%%:*}" --partitions "$${topic##*:}" \
            --replication-factor 3 --config min.insync.replicas=2
        done

  orders:
    build: !reset null
    pull_policy: never
    restart: unless-stopped
    ports: !override ["8202:8080"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap
      # acks=all: Kafka confirma solo con min.insync.replicas (2) copias. El default de SmallRye
      # es acks=1 (ver application.properties). Prueba ORDERS_ACKS=1 para ver la diferencia.
      ORDERS_ACKS: ${ORDERS_ACKS:-all}

  inventory:
    build: !reset null
    pull_policy: never
    restart: unless-stopped
    ports: !override ["8203:8000"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap

  inventory-worker:
    build: !reset null
    pull_policy: never
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap

  inventory-quarkus:
    build: !reset null
    pull_policy: never
    ports: !reset []
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap
