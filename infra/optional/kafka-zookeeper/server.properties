# Configuración "clásica" de un broker Kafka en modo ZooKeeper (Kafka ≤ 3.9).
# Compárala con las variables KAFKA_* de infra/kafka.yaml (modo KRaft).

# Identidad del broker. En ZooKeeper, cada broker se registra en /brokers/ids/<id>.
broker.id=1

# 👇 La diferencia clave: los METADATOS del clúster (topics, particiones, quién es
#    líder, configuración) viven en ZooKeeper, un sistema APARTE.
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

# Listeners: igual que en KRaft, pero SIN el listener CONTROLLER.
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://localhost:9092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL

log.dirs=/tmp/kafka-logs
num.partitions=3
auto.create.topics.enable=true

# Un solo broker: factores de replicación en 1 (inaceptable en prod).
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
